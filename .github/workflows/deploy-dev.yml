name: CD Deploy

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Create Firebase config
        run: |
          mkdir -p config
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > config/firebase-service-account.json

      - run: npx prisma generate

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            prisma
            config
            documents/ai
            package.json
            package-lock.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: artifact

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "artifact/*"
          target: "C:/apps/IntelliServOps"
          strip_components: 1

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /d C:\apps\IntelliServOps && (pm2 stop IntelliServOps || echo "not running") && npm i && npx prisma migrate deploy && npx prisma generate && (pm2 restart IntelliServOps || pm2 start dist/src/main.js --name IntelliServOps) && pm2 save
