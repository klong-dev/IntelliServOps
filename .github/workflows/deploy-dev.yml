name: CD - Deploy to VPS on Dev merge

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy to Windows VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd 'C:\apps\IntelliServOps'
            echo ">>> Git pull..."
            git pull origin dev
            echo ">>> Install dependencies..."
            npm install
            echo ">>> Prisma generate..."
            npx prisma generate
            echo ">>> Build..."
            npm run build
            echo ">>> Restarting app..."
            pm2 restart IntelliServOps
            pm2 save
            echo ">>> Done!"